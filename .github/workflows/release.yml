name: デスクトップ版のビルド

# v1.0.0 のようなタグを付けて push すると、Windows / Mac / Linux 用のアプリを作って
# GitHub の Releases に添付します。Actions の画面から手動でも実行できます。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-latest]  # Mac は Apple Silicon の実行機が混みやすいため Intel 版（M1 以降の Mac でも動きます）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Electron のダウンロードが一時的に失敗（504 など）しても、少し待って3回までやり直す
      - name: npm install（やり直しあり）
        shell: bash
        run: |
          for n in 1 2 3; do
            npm install && exit 0
            echo "npm install に失敗（$n 回目）。60秒待ってやり直します"; sleep 60
          done
          exit 1
      - run: npm test
      - name: アプリを作る
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: tenji-editor-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
