name: デスクトップ版のビルド

# v1.0.0 のようなタグを付けて push すると、Windows / Mac / Linux 用のアプリを作って
# GitHub の Releases に添付します。Actions の画面から手動でも実行できます。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-latest]  # Mac は Apple Silicon の実行機が混みやすいため Intel 版（M1 以降の Mac でも動きます）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Electron のダウンロードが失敗（504 など）したら、少し待ってやり直す。
      # 2回目からは Electron のミラー（npmmirror）から取る。以後の手順（アプリを作る）も同じミラーを使う
      - name: npm install（やり直しあり）
        shell: bash
        run: |
          for n in 1 2 3; do
            if [ "$n" -ge 2 ]; then
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
              echo "ELECTRON_MIRROR=$ELECTRON_MIRROR" >> "$GITHUB_ENV"
              echo "Electron のミラーを使います"
            fi
            npm install && exit 0
            echo "npm install に失敗（$n 回目）。30秒待ってやり直します"; sleep 30
          done
          exit 1
      - run: npm test
      - name: アプリを作る
        shell: bash
        run: |
          npx electron-builder --publish never && exit 0
          echo "失敗したので Electron とビルド用ツールのミラーでやり直します"
          ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/ ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/ npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: tenji-editor-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
