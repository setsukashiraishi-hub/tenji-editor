name: テストとGitHub Pagesへの公開

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/rules.test.js
      - run: node test/roundtrip.test.js
      - run: node test/office.test.js
      - run: node test/real.test.js
      - run: node test/symbols.test.js
      - run: node test/layout.test.js
      - run: node test/figure.test.js
      - run: node test/bse.test.js
      - run: node test/official.test.js
      - run: node test/corpus.test.js
      - run: node test/english.test.js
      - run: node test/math.test.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルをまとめる
        run: |
          mkdir _site
          cp -r index.html help.html css js vendor dict _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
