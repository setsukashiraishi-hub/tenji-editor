<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>点訳エディタ</title>
  <meta name="description" content="墨字（テキスト・Word）と点字データ（BSE・BRL・BRF・PEF・BES）を相互に変換する点訳エディタ">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 36%22%3E%3Ccircle cx=%226%22 cy=%226%22 r=%224%22 fill=%22%231f5f6b%22/%3E%3Ccircle cx=%2218%22 cy=%2218%22 r=%224%22 fill=%22%231f5f6b%22/%3E%3Ccircle cx=%226%22 cy=%2230%22 r=%224%22 fill=%22%231f5f6b%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="brand-cells" aria-hidden="true">⠟⠴⠐⠳</span>
      <span class="brand-name">点訳エディタ</span>
    </div>

    <div class="bar-group">
      <button type="button" id="btn-open" class="btn primary">ファイルを開く</button>
      <input type="file" id="file-input" hidden
             accept=".txt,.docx,.xlsx,.xlsm,.pdf,.png,.jpg,.jpeg,.gif,.bmp,.webp,.bse,.brl,.brf,.pef,.bes,.besx,.brt,.txn,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      <button type="button" id="btn-new" class="btn">新規</button>
    </div>

    <div class="bar-group">
      <label class="field" for="mode">
        <span>変換の向き</span>
        <select id="mode">
          <option value="sumiji">墨字 → 点字</option>
          <option value="braille-nabcc">点字（NABCC/BSE） → 墨字</option>
          <option value="braille-unicode">点字（Unicode） → 墨字</option>
        </select>
      </label>
    </div>

    <div class="bar-group">
      <label class="field small" for="cols"><span>マス</span><input id="cols" type="number" min="10" max="60" value="32"></label>
      <label class="field small" for="lines"><span>行</span><input id="lines" type="number" min="5" max="40" value="18"></label>
      <label class="check" for="indent"><input id="indent" type="checkbox" checked> 段落の頭を2マスあける</label>
      <label class="check" for="hira"><input id="hira" type="checkbox"> ひらがなで表示</label>
      <label class="check" for="pagenum"><input id="pagenum" type="checkbox"> ページ番号を付ける</label>
      <label class="check" for="genpon"><input id="genpon" type="checkbox"> 原本ページも書く</label>
    </div>

    <div class="bar-group end">
      <div class="menu" id="export-menu">
        <button type="button" class="btn primary" id="btn-export" aria-haspopup="true" aria-expanded="false">書き出す ▾</button>
        <div class="menu-pop" id="export-pop" role="menu" hidden></div>
      </div>
    </div>
  </header>

  <main class="panes" id="drop-zone">
    <section class="pane pane-src" aria-labelledby="src-title">
      <div class="pane-head">
        <h2 id="src-title">読み込んだファイル</h2>
        <span class="file-name" id="file-name">例文</span>
        <div class="head-actions" id="sumiji-actions" hidden>
          <label class="check" for="join"><input id="join" type="checkbox" checked> 行をつなげて段落にする</label>
          <button type="button" class="btn small-btn primary" id="btn-save-txt">テキストで保存</button>
          <button type="button" class="btn small-btn" id="btn-save-docx">Wordで保存</button>
        </div>
      </div>
      <div class="note" id="file-note" hidden></div>
      <textarea id="src" spellcheck="false" aria-label="原文"></textarea>
      <textarea id="sumiji" spellcheck="false" aria-label="墨字に起こした文章" hidden></textarea>
    </section>

    <section class="pane pane-out" aria-labelledby="out-title">
      <div class="pane-head">
        <h2 id="out-title">変換データ</h2>
        <span class="legend" id="out-legend">上段：かな（□＝マスあけ）／下段：6点　行を押すとかなを直せます</span>
        <div class="head-actions">
          <label class="check" for="sixdot" id="sixdot-wrap" hidden title="F D S J K L を同時に押して1マス入力。スペースでマスあけ"><input id="sixdot" type="checkbox"> 6点入力</label>
          <button type="button" class="btn small-btn" id="btn-raw" hidden aria-expanded="false">元データ（NABCC等）を編集</button>
        </div>
      </div>
      <textarea id="raw" spellcheck="false" aria-label="点字の元データ" hidden></textarea>
      <ol class="rows" id="rows"></ol>
    </section>
  </main>

  <footer class="status" id="status">
    <span id="st-dict" class="pill wait">辞書を読み込み中…</span>
    <span id="st-count"></span>
    <span id="st-warn"></span>
    <span class="nav-check" id="nav-check" hidden>
      <button type="button" class="btn small-btn" id="btn-prev-check" aria-label="前の要確認へ">‹ 前</button>
      <button type="button" class="btn small-btn" id="btn-next-check" aria-label="次の要確認へ">次 ›</button>
    </span>
    <a class="st-help" href="https://github.com/setsukashiraishi-hub/tenji-editor#readme" target="_blank" rel="noopener">使い方</a>
  </footer>

  <dialog class="tactile" id="tactile-dlg" aria-labelledby="t-head">
    <div class="t-layout">
      <div class="t-side">
        <h2 id="t-head">点図ファイルに書き出す</h2>
        <p class="t-lead">本文のマス目に縛られずに、用紙全体へ等間隔に点を打ちます。</p>
        <fieldset class="t-field">
          <legend>使い道</legend>
          <label class="check" for="t-style-dots"><input type="radio" name="t-style" id="t-style-dots" checked> 点図プリンタ用（点で打つ。ViewPlus Tiger など）</label>
          <label class="check" for="t-style-solid"><input type="radio" name="t-style" id="t-style-solid"> 立体コピー用（黒く塗る。カプセルペーパー）</label>
        </fieldset>
        <label class="field" for="t-paper"><span>用紙</span><select id="t-paper"></select></label>
        <label class="check" for="t-landscape"><input type="checkbox" id="t-landscape"> 横向き</label>
        <label class="field" for="t-pitch"><span>点の間隔（mm）</span><input type="number" id="t-pitch" min="1" max="5" step="0.1" value="2.5"></label>
        <label class="field" for="t-size"><span>点の大きさ</span><select id="t-size"></select></label>
        <label class="field col" for="t-title"><span>図の見出し（かなで。点字にして図の上に入れます）</span><input type="text" id="t-title" placeholder="例：ズ1 テンジノ シクミ"></label>
        <p class="t-info" id="t-info"></p>
        <div class="t-actions">
          <button type="button" class="btn primary" id="t-pdf">PDFで保存</button>
          <button type="button" class="btn" id="t-svg">SVGで保存</button>
          <button type="button" class="btn" id="t-close">閉じる</button>
        </div>
      </div>
      <div class="t-view"><canvas id="t-preview" aria-label="点図のプレビュー"></canvas></div>
    </div>
  </dialog>

  <div class="drop-hint" id="drop-hint" hidden>ここにファイルを離すと読み込みます</div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/kuromoji.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/figure.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
